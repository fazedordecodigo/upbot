name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential zip unzip
      - run: bun install --frozen-lockfile
      - name: Install ARM64 Linux test browser
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          bun -e 'import { chromium } from "playwright-core"; console.log(`CHROME_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      # ARM64 Windows assembly/crypto cold starts can exceed the vault subprocess timeout.
      - name: Warm up Windows ARM64 DPAPI
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          $ErrorActionPreference = 'Stop'
          try {
            Add-Type -AssemblyName System.Security
            $bytes = [byte[]]::new(32)
            $protected = [Security.Cryptography.ProtectedData]::Protect($bytes, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
            $plain = [Security.Cryptography.ProtectedData]::Unprotect($protected, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)
            if ([Convert]::ToBase64String($bytes) -ne [Convert]::ToBase64String($plain)) { exit 2 }
            exit 0
          } catch {
            Write-Output ($_.Exception.GetType().FullName)
            exit 1
          }
          '@
          & powershell.exe -NoProfile -NonInteractive -Command $script
          exit $LASTEXITCODE
      - run: bun run test
      - run: bun run build:daemon
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: bun run --cwd apps/desktop build
