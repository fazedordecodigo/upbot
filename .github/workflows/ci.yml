name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential zip unzip
      - run: bun install --frozen-lockfile
      - name: Install ARM64 Linux test browser
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          bun -e 'import { chromium } from "playwright-core"; console.log(`CHROME_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Temporary Windows ARM64 DPAPI diagnostics
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $context = '$PSVersionTable.PSVersion.ToString(); [Environment]::Is64BitProcess; $env:PROCESSOR_ARCHITECTURE'
          & powershell.exe -NoProfile -NonInteractive -Command $context
          foreach ($attempt in 1..2) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & powershell.exe -NoProfile -NonInteractive -Command 'exit 0'
            Write-Output "exit-$attempt exit=$LASTEXITCODE ms=$($timer.ElapsedMilliseconds)"
          }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -Command "try { Add-Type -AssemblyName System.Security; exit 0 } catch { Write-Output (`$_.Exception.GetType().FullName); exit 1 }"
          Write-Output "add-type exit=$LASTEXITCODE ms=$($timer.ElapsedMilliseconds)"
          $script = @'
          $ErrorActionPreference = 'Stop'; try { Add-Type -AssemblyName System.Security; $hex = [Console]::In.ReadToEnd().Trim(); $bytes = [byte[]]::new([int]($hex.Length / 2)); for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16) }; $protected = [Security.Cryptography.ProtectedData]::Protect($bytes, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser); $plain = [Security.Cryptography.ProtectedData]::Unprotect($protected, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser); if ([Convert]::ToBase64String($bytes) -ne [Convert]::ToBase64String($plain)) { exit 2 }; exit 0 } catch { Write-Output ($_.Exception.GetType().FullName); exit 1 }
          '@
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ('01' * 32) | & powershell.exe -NoProfile -NonInteractive -Command $script
          Write-Output "piped-roundtrip exit=$LASTEXITCODE ms=$($timer.ElapsedMilliseconds)"
          bun scripts/diagnose-dpapi.ts
      - run: bun run test
        if: matrix.os != 'windows-11-arm'
      - run: bun run build:daemon
        if: matrix.os != 'windows-11-arm'
      - run: cargo check --locked
        if: matrix.os != 'windows-11-arm'
        working-directory: apps/desktop/src-tauri
      - run: bun run --cwd apps/desktop build
        if: matrix.os != 'windows-11-arm'
