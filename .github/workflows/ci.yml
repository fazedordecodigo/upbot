name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-22.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential zip unzip
      - run: bun install --frozen-lockfile
      - name: Install ARM64 Linux test browser
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          bun -e 'import { chromium } from "playwright-core"; console.log(`CHROME_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Temporary Windows ARM64 DPAPI diagnostics
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $load = "[void][Reflection.Assembly]::Load('System.Security, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a')"
          $trip = '$b = [byte[]]::new(32); $p = [Security.Cryptography.ProtectedData]::Protect($b, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser); [void][Security.Cryptography.ProtectedData]::Unprotect($p, $null, [Security.Cryptography.DataProtectionScope]::CurrentUser)'
          $cases = [ordered]@{
            'new-dpapi-cold' = @('-Command', "`$ErrorActionPreference = 'Stop'; `$PSModuleAutoLoadingPreference = 'None'; $load; $trip")
            'exit' = @('-Command', 'exit 0')
            'import-utility-bypass' = @('-ExecutionPolicy', 'Bypass', '-Command', "`$ErrorActionPreference = 'Stop'; Import-Module Microsoft.PowerShell.Utility")
            'import-utility' = @('-Command', "`$ErrorActionPreference = 'Stop'; Import-Module Microsoft.PowerShell.Utility")
            'old-add-type' = @('-Command', "`$ErrorActionPreference = 'Stop'; Add-Type -AssemblyName System.Security; $trip")
            'new-dpapi-again' = @('-Command', "`$ErrorActionPreference = 'Stop'; `$PSModuleAutoLoadingPreference = 'None'; $load; $trip")
          }
          foreach ($name in $cases.Keys) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $null = & powershell.exe -NoProfile -NonInteractive @($cases[$name]) 2>&1
            Write-Output "$name exit=$LASTEXITCODE ms=$($timer.ElapsedMilliseconds)"
          }
          & powershell.exe -NoProfile -NonInteractive -Command 'Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String'
      - run: bun run test
      - run: bun run build:daemon
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: bun run --cwd apps/desktop build
