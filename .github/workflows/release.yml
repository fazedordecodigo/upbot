name: Release

# Push a v* tag (matching apps/desktop/src-tauri/tauri.conf.json "version") to build the
# macOS app/dmg, Linux AppImage/deb, and Windows NSIS installer. The release remains
# a draft until updater metadata has been composed from every platform's assets.
# Dispatch requires a tag.
# APPLE_* secrets enable macOS signing and app/DMG notarization; WINDOWS_CERTIFICATE
# and WINDOWS_CERTIFICATE_PASSWORD enable Windows PFX signing. Partial sets fail.
# Without signing secrets, macOS is ad-hoc signed and Windows is unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$REF_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Expected a version tag such as v0.3.0; got '$tag'." >&2
            exit 1
          fi
          if release="$(gh release view "$tag" --json databaseId,isDraft 2>/dev/null)"; then
            if [ "$(jq -r .isDraft <<< "$release")" != "true" ]; then
              echo "Release $tag already exists and is not a draft." >&2
              exit 1
            fi
            id="$(jq -r .databaseId <<< "$release")"
          else
            gh release create "$tag" --draft --title "Boto $tag" \
              --notes "See the commits since the previous release."
            release="$(gh release view "$tag" --json databaseId,isDraft)"
            id="$(jq -r .databaseId <<< "$release")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential zip unzip
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Enable Apple signing when configured
        id: apple-signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          validate_group() {
            local present=0
            local missing=()
            for v in "$@"; do
              if [ -n "${!v}" ]; then
                present=$((present + 1))
              else
                missing+=("$v")
              fi
            done
            if [ "$present" -gt 0 ] && [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::Missing secrets: ${missing[*]}"
              exit 1
            fi
          }
          validate_group APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          validate_group APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          if [ -n "$APPLE_ID" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::Notarization requires APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY"
            exit 1
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "notarized=false" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Code signing enabled"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$APPLE_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
              done
              echo "Notarization enabled"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "APPLE_* secrets not set: building unsigned (ad-hoc)"
          fi
      - name: Enable Windows signing when configured
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:WINDOWS_CERTIFICATE -and !$env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "Windows signing secrets not set: building unsigned"
            "config=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          foreach ($name in @('WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD')) {
            if (![Environment]::GetEnvironmentVariable($name)) {
              Write-Host "::error::Missing secret: $name"
              exit 1
            }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'boto-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certs = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $cert = @($certs | Where-Object HasPrivateKey)
            if ($cert.Count -ne 1) { throw 'Expected one signing certificate with a private key' }
            $config = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert[0].Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
              tsp = $true
            } } }
            $config | ConvertTo-Json -Depth 4 | Set-Content apps/desktop/src-tauri/tauri.windows-signing.conf.json
            "config=--config src-tauri/tauri.windows-signing.conf.json" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json ${{ steps.windows-signing.outputs.config }}
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          includeUpdaterJson: false
      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS' && steps.apple-signing.outputs.notarized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -eq 0 ] || [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::Missing macOS app or DMG"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          for app in "${apps[@]}"; do
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
          done
          gh release upload "$TAG" "${dmgs[@]}" --clobber
      - name: Verify macOS signatures
        if: runner.os == 'macOS' && steps.apple-signing.outputs.signed == 'true'
        run: |
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          dmgs=(apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -eq 0 ] || [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::Missing macOS app or DMG"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict -vv "$app"
          done
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && steps.windows-signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'apps/desktop/src-tauri/target/release'
          $installers = @(Get-ChildItem "$release/bundle/nsis/*.exe" -File)
          if ($installers.Count -eq 0) { throw 'Missing NSIS installer' }
          $sidecars = @(Get-ChildItem 'apps/desktop/src-tauri/binaries/botod-*.exe' -File)
          if ($sidecars.Count -eq 0) { throw 'Missing bundled botod sidecar' }
          $files = @("$release/boto-desktop.exe") + @($sidecars.FullName) + @($installers.FullName)
          foreach ($file in $files) {
            if (!(Test-Path $file -PathType Leaf)) { throw "Missing signed executable: $file" }
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature on ${file}: $($signature.Status)"
            }
            Write-Host "Valid signature: $file"
          }

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Compose and upload updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/boto-release"
          mkdir -p "$dir"
          gh release view "$TAG" --json assets > "$dir/assets.json"
          gh release view "$TAG" --json body --jq .body > "$dir/notes.md"
          gh release download "$TAG" --pattern '*.sig' --dir "$dir"
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          python3 scripts/compose-latest.py \
            --assets-json "$dir/assets.json" \
            --signatures-dir "$dir" \
            --repository "$GH_REPO" \
            --tag "$TAG" \
            --expected-version "$version" \
            --notes-file "$dir/notes.md" \
            --output "$dir/latest.json"
          gh release upload "$TAG" "$dir/latest.json" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
